services:
  - type: web
    name: heatmap-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/paths
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: heatmap-data
      mountPath: /data
      sizeGB: 1
